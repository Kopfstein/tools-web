<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="https://unpkg.com/tachyons@4.12.0/css/tachyons.min.css">
    <style>
        /* Custom styles for features not in Tachyons */
        body {
            background-color: #f4f4f4;
        }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1f2937;
                color: #f9fafb;
            }
            .card {
                background-color: #111827;
            }
            .timer-display {
                color: #f9fafb;
            }
            .label-text {
                color: #d1d5db;
            }
            .input-field {
                background-color: #1f2937;
                border-color: #4b5563;
                color: #f9fafb;
            }
            .btn-reset {
                background-color: #374151;
                color: #f9fafb;
            }
            .btn-reset:hover {
                background-color: #4b5563;
            }
            .instructions {
                color: #9ca3af;
            }
        }

        /* Timer display */
        .timer-display {
            font-size: 4rem;
            font-family: monospace;
            color: #111;
        }

        /* Button styles */
        .btn {
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        .btn:focus {
            outline: 2px solid;
            outline-offset: 2px;
        }

        .btn-blue {
            background-color: #3b82f6;
            color: white;
        }

        .btn-blue:hover {
            background-color: #2563eb;
        }

        .btn-blue:focus {
            outline-color: #3b82f6;
        }

        .btn-green {
            background-color: #10b981;
            color: white;
        }

        .btn-green:hover {
            background-color: #059669;
        }

        .btn-green:focus {
            outline-color: #10b981;
        }

        .btn-yellow {
            background-color: #eab308;
            color: white;
        }

        .btn-yellow:hover {
            background-color: #ca8a04;
        }

        .btn-yellow:focus {
            outline-color: #eab308;
        }

        .btn-reset {
            background-color: #d1d5db;
            color: #111827;
        }

        .btn-reset:hover {
            background-color: #9ca3af;
        }

        .btn-reset:focus {
            outline-color: #6b7280;
        }

        /* Input field */
        .input-field {
            background-color: white;
            border: 1px solid #d1d5db;
            color: #111827;
        }

        .input-field:focus {
            outline: 2px solid #3b82f6;
            outline-offset: 0;
        }

        /* Card */
        .card {
            background-color: white;
        }

        /* Instructions */
        .instructions {
            color: #6b7280;
        }

        /* Responsive timer display */
        @media screen and (max-width: 30em) {
            .timer-display {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body class="min-vh-100 flex items-center justify-center pa3">
    <div class="w-100 mw6 center">
        <!-- Main card -->
        <div class="card br3 shadow-2 pa4">
            <h1 class="f2 b tc mb4 timer-display">
                Pomodoro Timer
            </h1>

            <!-- Timer display -->
            <div class="tc mb4">
                <div id="timer-display" class="timer-display b"
                     role="timer" aria-live="polite" aria-atomic="true">
                    25:00
                </div>
            </div>

            <!-- Preset buttons -->
            <div class="flex mb3">
                <button id="btn-10min"
                        class="btn btn-blue w-50 mr2 ph3 pv2 br2"
                        aria-label="Set timer to 10 minutes">
                    10 min
                </button>
                <button id="btn-25min"
                        class="btn btn-blue w-50 ml2 ph3 pv2 br2"
                        aria-label="Set timer to 25 minutes">
                    25 min
                </button>
            </div>

            <!-- Custom duration input -->
            <div class="mb3">
                <label for="custom-duration" class="db f6 fw5 mb2 label-text">
                    Custom Duration (minutes)
                </label>
                <input type="number"
                       id="custom-duration"
                       min="1"
                       max="999"
                       placeholder="Enter minutes"
                       class="input-field w-100 ph3 pv2 br2"
                       aria-label="Enter custom duration in minutes">
            </div>

            <!-- Start/Pause button -->
            <button id="btn-start-pause"
                    class="btn btn-green w-100 ph3 pv3 br2 f5 b"
                    aria-label="Start timer">
                Start
            </button>

            <!-- Reset button -->
            <button id="btn-reset"
                    class="btn btn-reset w-100 mt3 ph3 pv2 br2"
                    aria-label="Reset timer">
                Reset
            </button>
        </div>

        <!-- Instructions -->
        <div class="mt3 tc f6 instructions">
            <p>Press Space to start/pause • Press R to reset</p>
        </div>
    </div>

    <script>
        // Timer state
        let totalSeconds = 25 * 60; // Default 25 minutes
        let remainingSeconds = totalSeconds;
        let timerInterval = null;
        let isRunning = false;

        // Initialize AudioContext (for iOS/Safari compatibility)
        let audioContext = null;
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Resume if suspended (required for iOS)
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        // DOM elements
        const timerDisplay = document.getElementById('timer-display');
        const btnStartPause = document.getElementById('btn-start-pause');
        const btnReset = document.getElementById('btn-reset');
        const btn10min = document.getElementById('btn-10min');
        const btn25min = document.getElementById('btn-25min');
        const customDurationInput = document.getElementById('custom-duration');

        // Format seconds to MM:SS
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Update timer display
        function updateDisplay() {
            timerDisplay.textContent = formatTime(remainingSeconds);
        }

        // Set timer duration
        function setDuration(minutes) {
            if (isRunning) {
                stopTimer();
            }
            totalSeconds = minutes * 60;
            remainingSeconds = totalSeconds;
            updateDisplay();
            // Save to localStorage
            localStorage.setItem('pomodoroTimer', totalSeconds);
        }

        // Start timer countdown
        function startTimer() {
            if (remainingSeconds === 0) {
                remainingSeconds = totalSeconds;
            }

            isRunning = true;
            btnStartPause.textContent = 'Pause';
            btnStartPause.classList.remove('btn-green');
            btnStartPause.classList.add('btn-yellow');
            btnStartPause.setAttribute('aria-label', 'Pause timer');

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateDisplay();

                if (remainingSeconds <= 0) {
                    stopTimer();
                    playGongSound();
                    // Show notification
                    if (Notification.permission === 'granted') {
                        new Notification('Pomodoro Timer', {
                            body: 'Time is up!',
                            icon: '⏰'
                        });
                    }
                }
            }, 1000);
        }

        // Stop timer
        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            btnStartPause.textContent = 'Start';
            btnStartPause.classList.remove('btn-yellow');
            btnStartPause.classList.add('btn-green');
            btnStartPause.setAttribute('aria-label', 'Start timer');
        }

        // Reset timer
        function resetTimer() {
            stopTimer();
            remainingSeconds = totalSeconds;
            updateDisplay();
        }

        // Play gong sound using Web Audio API
        function playGongSound() {
            // Fallback if AudioContext not initialized
            if (!audioContext) {
                console.warn('AudioContext not initialized');
                // Vibrate as fallback on mobile devices
                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 200, 100, 400]);
                }
                return;
            }

            try {
                // Ensure AudioContext is running (important for iOS)
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                const duration = 2.0;

                // Create oscillator for the gong sound
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                // Gong-like sound: start at high frequency and decay
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(100, audioContext.currentTime + duration);

                // Envelope: quick attack, slow decay (increased volume)
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.7, audioContext.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + duration);
            } catch (error) {
                console.error('Error playing gong sound:', error);
                // Vibrate as fallback
                if (navigator.vibrate) {
                    navigator.vibrate([200, 100, 200, 100, 400]);
                }
            }
        }

        // Event listeners
        btnStartPause.addEventListener('click', () => {
            // Initialize AudioContext on first user interaction (required for iOS/Safari)
            initAudioContext();

            if (isRunning) {
                stopTimer();
            } else {
                startTimer();
            }
        });

        btnReset.addEventListener('click', resetTimer);

        btn10min.addEventListener('click', () => {
            initAudioContext(); // Initialize on user interaction
            setDuration(10);
        });
        btn25min.addEventListener('click', () => {
            initAudioContext(); // Initialize on user interaction
            setDuration(25);
        });

        customDurationInput.addEventListener('change', (e) => {
            const minutes = parseInt(e.target.value);
            if (minutes > 0 && minutes <= 999) {
                setDuration(minutes);
                e.target.value = '';
            }
        });

        customDurationInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const minutes = parseInt(e.target.value);
                if (minutes > 0 && minutes <= 999) {
                    setDuration(minutes);
                    e.target.value = '';
                }
            }
        });

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            // Ignore if typing in input field
            if (e.target === customDurationInput) {
                return;
            }

            if (e.key === ' ' || e.key === 'Spacebar') {
                e.preventDefault();
                btnStartPause.click();
            } else if (e.key === 'r' || e.key === 'R') {
                e.preventDefault();
                btnReset.click();
            }
        });

        // Request notification permission on load
        if ('Notification' in window && Notification.permission === 'default') {
            Notification.requestPermission();
        }

        // Load saved duration from localStorage
        window.addEventListener('load', () => {
            const saved = localStorage.getItem('pomodoroTimer');
            if (saved) {
                totalSeconds = parseInt(saved);
                remainingSeconds = totalSeconds;
                updateDisplay();
            }
        });
    </script>
</body>
</html>
